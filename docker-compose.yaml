version: '3.8'

services:
  
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: pcos-mlflow
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port 5000 
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlflow
    networks:
      - pcos-network

 
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pcos-api
    ports:
      - "8000:8000"
    volumes:
      - ./app/models:/app/app/models
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - mlflow
    networks:
      - pcos-network


networks:
  pcos-network:
    driver: bridge